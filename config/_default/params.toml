mainSections = ["post"]
rssFullContent = true
favicon = "img/favicon.svg"
SortBy = "default"

[footer]
    since = 2026
    customText = "© Aurélien Giroux · Textes personnels."

[dateFormat]
    published = ":date_full"
    lastUpdated = ":date_full"

[sidebar]
    subtitle = "Finance, probabilités, épistémologie et autres notes."

[article]
    headingAnchor = true
    math = true
    readingTime = true

    [article.license]
        enabled = false

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[colorScheme]
    toggle = true
    default = "auto"

[comments]
    enabled = false
